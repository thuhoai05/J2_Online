        <!--RoadMap Backend Java
        -HTML: thuộc về giao diện người dùng -> form và table
        Servlet: là 1 thành phần phía server dùng để xử lý các yêu cầu liên quan từ client, tạo ra phản hồi và gửi lại phản hồi cho client
        -JSP: sử dụng để thay thế cho html -> cho phép viết cả code java và code html trên cùng 1 file 
        -JSTL: cho phép tương tác giữa Servlet(thông tin lấy về từ database) với JSP dễ dàng hơn 
        -JDBC: cho phép kết nối với database 
        -Máy chủ ứng dụng: Tomcat
        Client: máy khách
        Server: máy chủ (tomcat)
        Client sẽ gửi request cho server 
        Server sẽ gửi lại response cho client 
        Chu trình hoạt động của servlet :
        -Client gửi request HTTP lên server 
        Server nhận request đó và đẩy nó sang Servlet
        -Servlet sẽ xử lý request: xử lý các tham số trong request, logic, tương tác với cơ sở dữ liệu,...
        -Servlet sẽ gửi response cho Client 
        
        
        -Internet: là hệ thống toàn cầu để kết nối với nhau, sử dụng bộ giao thức để chia sẻ và liên lạc thông tin 
        -IP: nhận diện riêng của những kết nối
        -Domain: là network của các máy tính và thiết bị được quản lý bởi 1 công ty cụ thể
        -DNS: sẽ dịch tên miền thành địa chỉ IP, sau đó máy chủ DNS sẽ kết nối người dùng với trang web
        -Hosting: cung cấp chỗ ở và bảo trì 
        -GUI (giao diện người dùng): hiển thị đối tượng truyền tải thông tin đến với người dùng cũng như biểu thị các hành động mà người dùng có thể thực hiện 
        -->
